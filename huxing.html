<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>户型图设计工具</title>
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --panel2:#f6f8fb; --border:#d8dfe8;
  --text:#22303f; --muted:#6b7a8c; --accent:#2f6fed; --accent-weak:#e8f0fe;
  --wall:#45505e; --danger:#d64545;
  --shadow:0 1px 3px rgba(20,35,60,.08);
  --header-h:52px; --footer-h:28px; --side-w:252px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13px/1.5 "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;color:var(--text);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit}
svg{display:block}

/* ===== 顶部工具栏 ===== */
header{height:var(--header-h);background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:5px;padding:0 10px;flex:0 0 auto;z-index:30}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin-right:6px;white-space:nowrap}
.brand .logo{width:24px;height:24px;color:var(--accent)}
.tbar-group{display:flex;align-items:center;gap:2px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:3px;margin-right:3px}
.tbar-group.right{margin-left:auto;margin-right:0}
.tbtn{display:flex;align-items:center;gap:5px;border:0;background:transparent;color:var(--text);font-size:12.5px;padding:5px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:#e9edf3}
.tbtn.active{background:var(--accent);color:#fff}
.tbtn.on{background:var(--accent-weak);color:var(--accent)}
.tbtn:disabled{opacity:.35;cursor:default}
.tbtn svg{width:15px;height:15px;flex:0 0 auto}
.tsep{width:1px;height:18px;background:var(--border);margin:0 3px}
#btn-sidebar-toggle{display:none}

/* ===== 主体 ===== */
main{flex:1;display:flex;min-height:0}

/* 左侧家具库 */
#sidebar{width:var(--side-w);background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex:0 0 auto;min-height:0}
.side-head{padding:11px 12px 5px;font-weight:600;font-size:13px}
.side-head small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:1px}
.img-panel{padding:10px 12px 8px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)}
.img-title{font-weight:600;font-size:13px;color:var(--text)}
.img-title small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:1px}
.img-row{display:flex;align-items:center;gap:7px;margin:7px 0 2px;font-size:12px;color:var(--muted)}
.img-row label{flex:0 0 auto}
.img-row input[type=number]{width:58px;border:1px solid var(--border);border-radius:6px;background:var(--panel2);color:var(--text);padding:3px 6px;font-size:12px}
.img-row input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.img-del{margin-top:6px;width:100%;border:1px solid var(--border);background:var(--panel2);color:var(--muted);border-radius:7px;padding:4px 0;font-size:12px;cursor:pointer}
.img-del:hover{color:#d64545;border-color:#e2b6b6;background:#fdf3f3}
.img-trace{margin-top:7px;width:100%;border:1px solid #b9c6f2;background:#eef2fd;color:#3a55c9;border-radius:7px;padding:6px 0;font-size:12px;font-weight:600;cursor:pointer}
.img-trace:hover{background:#e2e9fb}
.img-trace:disabled{opacity:.55;cursor:wait}
.img-tip{font-size:11px;color:var(--muted);margin:6px 2px 0;line-height:1.5}
.cat-tabs{display:flex;flex-wrap:wrap;gap:4px;padding:6px 10px 8px}
.cat{border:1px solid var(--border);background:var(--panel2);color:var(--muted);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.cat:hover{color:var(--text)}
.hidden{display:none!important}
.cat.active{background:var(--accent);border-color:var(--accent);color:#fff}
.furn-grid{flex:1;overflow-y:auto;padding:2px 10px 16px;display:grid;grid-template-columns:repeat(2,1fr);gap:7px;align-content:start}
.furn{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--border);border-radius:8px;background:var(--panel2);padding:7px 4px 5px;cursor:pointer;font-size:11.5px;color:var(--text)}
.furn:hover{border-color:var(--accent)}
.furn.sel{border-color:var(--accent);background:var(--accent-weak)}
.furn canvas{width:50px;height:50px}
.furn-grid::-webkit-scrollbar{width:8px}
.furn-grid::-webkit-scrollbar-thumb{background:#cdd6e1;border-radius:4px}

/* 画布 */
#canvas-wrap{position:relative;flex:1;min-width:0;overflow:hidden}
#canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
#hint{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.94);border:1px solid var(--border);border-radius:8px;padding:6px 11px;font-size:12px;color:var(--muted);box-shadow:var(--shadow);max-width:72%;pointer-events:none}
#hint b{color:var(--accent);font-weight:600}

/* 底部状态栏 */
footer{height:var(--footer-h);background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 12px;font-size:12px;color:var(--muted);flex:0 0 auto;white-space:nowrap;overflow:hidden}
footer .sp{flex:1}
footer .mono{font-variant-numeric:tabular-nums}

/* 提示浮层 */
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%) translateY(10px);background:#22303f;color:#fff;padding:8px 16px;border-radius:8px;font-size:12.5px;opacity:0;pointer-events:none;transition:.25s;z-index:60;box-shadow:0 4px 14px rgba(20,35,60,.25)}
#toast.show{opacity:1;transform:translateX(-50%)}

/* 窄屏适配 */
@media(max-width:920px){
  #sidebar{position:fixed;left:0;top:var(--header-h);bottom:var(--footer-h);z-index:25;box-shadow:2px 0 14px rgba(0,0,0,.14);transform:translateX(-102%);transition:transform .2s}
  #sidebar.open{transform:none}
  #btn-sidebar-toggle{display:flex}
  .tbtn .tt{display:none}
  .tbtn{min-height:36px;padding:6px 10px}
  .brand .bname{display:none}
  header{gap:3px;padding:0 6px;height:auto;flex-wrap:wrap;padding-bottom:3px}
  #btn-example,#btn-clear,#btn-zoom-in,#btn-zoom-out,#btn-fit,#btn-label,#btn-save,#btn-load{display:none}
  #st-scale,#st-wall{display:none}
  .tbar-group.right{margin-left:0}
  .cat{min-height:30px}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/><path d="M9.5 20v-5h5v5"/></svg>
    <span class="bname">户型设计</span>
  </div>

  <div class="tbar-group">
    <button class="tbtn active" data-tool="select" title="选择 / 移动（V）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3l7.5 16.5 2-6.5 6.5-2z"/></svg><span class="tt">选择</span></button>
    <button class="tbtn" data-tool="wall" title="绘制墙体（W）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="6" rx="1"/><path d="M8 9v6M13 9v6M18 9v6"/></svg><span class="tt">墙体</span></button>
    <button class="tbtn" data-tool="arc" title="弧形墙（C）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a8 8 0 0116 0"/><path d="M4 7v3M20 7v3"/></svg><span class="tt">弧墙</span></button>
    <button class="tbtn" data-tool="furniture" title="放置家具（F）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h16v7H4z"/><path d="M6 6.5h12v3.5H6z"/><path d="M7 17v2M17 17v2"/></svg><span class="tt">家具</span></button>
    <button class="tbtn" data-tool="measure" title="测量距离（M）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19L19 5"/><path d="M5 19l-2 2M19 5l2-2"/><path d="M8.5 15.5L10 17M11.5 12.5L13 14M14.5 9.5L16 11"/></svg><span class="tt">测量</span></button>
    <button class="tbtn" id="btn-clear-measure" title="清除所有测量线"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19L19 5"/><path d="M5 19l-2 2M19 5l2-2"/><path d="M11 13l2-2M13.5 10.5l2-2"/></svg><span class="tt">清尺</span></button>
    <button class="tbtn" data-tool="eraser" title="橡皮擦：擦除墙体（E）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15.5L12 7.5l6.5 6.5-7.5 7.5H4z"/><path d="M8 11.5l6 6"/><path d="M16 20h4"/></svg><span class="tt">橡皮擦</span></button>
  </div>

  <div class="tbar-group">
    <button class="tbtn" id="btn-undo" title="撤销（Ctrl+Z）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5L4 10l5 5"/><path d="M4 10h11a5 5 0 015 5v1"/></svg><span class="tt">撤销</span></button>
    <button class="tbtn" id="btn-redo" title="重做（Ctrl+Shift+Z）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l5 5-5 5"/><path d="M20 10H9a5 5 0 00-5 5v1"/></svg><span class="tt">重做</span></button>
    <span class="tsep"></span>
    <button class="tbtn on" id="btn-grid" title="显示网格（G）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M4 12h16M12 4v16"/></svg><span class="tt">网格</span></button>
    <button class="tbtn" id="btn-label" title="显示墙体尺寸（L）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 5v14M6 12h12M18 5v14"/><path d="M3 12h3M18 12h3"/></svg><span class="tt">标注</span></button>
    <button class="tbtn" id="btn-center" title="显示/隐藏户型中心点"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg><span class="tt">中心</span></button>
    <button class="tbtn" data-tool="guide" title="参考线：横竖辅助线（X 切换方向）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 12h16M12 4v16"/><path d="M12 4v16"/><path d="M4 12h16"/></svg><span class="tt">参考线</span></button>
    <button class="tbtn" id="btn-img" title="上传户型图作底图，可显示/隐藏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="M21 15l-5-5-9 9"/></svg><span class="tt">底图</span></button>
    <button class="tbtn" id="btn-zoom-out" title="缩小"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    <button class="tbtn" id="btn-zoom-in" title="放大"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tbtn" id="btn-fit" title="适应视图"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4H4v4M16 4h4v4M8 20H4v-4M16 20h4v-4"/></svg><span class="tt">适应</span></button>
  </div>

  <div class="tbar-group right">
    <button class="tbtn" id="btn-example" title="载入示例户型"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/></svg><span class="tt">示例</span></button>
    <button class="tbtn" id="btn-clear" title="清空画布"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg><span class="tt">清空</span></button>
    <span class="tsep"></span>
    <button class="tbtn" id="btn-export" title="导出为 PNG 图片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10M8 10l4 4 4-4"/><path d="M5 19h14"/></svg><span class="tt">导出图片</span></button>
    <button class="tbtn" id="btn-save" title="保存项目（JSON）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg><span class="tt">保存</span></button>
    <button class="tbtn" id="btn-load" title="导入项目（JSON）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14V4M8 8l4-4 4 4"/><path d="M5 19h14"/></svg><span class="tt">导入</span></button>
  </div>

  <button class="tbtn" id="btn-sidebar-toggle" title="家具库"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="tt">家具</span></button>
</header>

<main>
  <aside id="sidebar">
    <div class="img-panel hidden" id="img-panel">
      <div class="img-title">底图<small>上传户型图后描墙定位</small></div>
      <div class="img-row"><label>宽度</label><input type="number" id="img-meters" min="1" max="100" step="0.5" value="10"><span>m</span></div>
      <div class="img-row"><label>透明度</label><input type="range" id="img-opacity" min="10" max="100" value="35"></div>
      <button class="img-trace" id="btn-trace">自动临摹墙体</button>
      <div class="img-row"><label>灵敏度</label><input type="range" id="trace-sens" min="10" max="90" value="50"></div>
      <div class="img-tip">识别白底深色线条的户型图效果最佳；识别结果可撤销或橡皮擦调整</div>
      <button class="img-del" id="img-del">移除底图</button>
    </div>
    <div class="img-panel">
      <div class="img-title">墙体<small>调节墙体线条粗细</small></div>
      <div class="img-row"><label>墙厚</label><input type="range" id="wall-thick" min="4" max="40" step="1" value="16"><span id="wall-thick-val">0.16 m</span></div>
    </div>
    <div class="side-head">家具库<small>点击家具，再到画布上放置</small></div>
    <div class="cat-tabs" id="cat-tabs"></div>
    <div class="furn-grid" id="furn-grid"></div>
  </aside>
  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div id="hint"></div>
  </div>
</main>

<footer>
  <span id="st-tool">工具：选择</span>  <span class="mono" id="st-coord">0.00, 0.00 m</span>
  <span class="mono" id="st-scale">100%</span>
  <span class="sp"></span>
  <span class="mono" id="st-wall">墙长 0.0 m</span>
  <span class="mono" id="st-furn">家具 0</span>
</footer>

<input type="file" id="file-input" accept=".json,application/json" hidden>
<input type="file" id="img-input" accept="image/*" hidden>
<div id="toast"></div>
